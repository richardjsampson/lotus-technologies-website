<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 650" role="img" aria-labelledby="title desc">
  <title id="title">Connected Lotus technology ecosystem</title>
  <desc id="desc">Applications, commerce, users, cloud services, infrastructure and data connected through a central Lotus orchestration hub.</desc>
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="48%" r="58%">
      <stop offset="0" stop-color="#1E63E9" stop-opacity=".22"/>
      <stop offset=".55" stop-color="#0F356D" stop-opacity=".10"/>
      <stop offset="1" stop-color="#0A1D3D" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#153B73" stop-opacity=".90"/>
      <stop offset="1" stop-color="#081B3A" stop-opacity=".92"/>
    </linearGradient>
    <linearGradient id="blueStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#74BEFF"/>
      <stop offset="1" stop-color="#1E63E9"/>
    </linearGradient>
    <linearGradient id="goldStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD27A"/>
      <stop offset="1" stop-color="#F2B84B"/>
    </linearGradient>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="nodeGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#4DA3FF" flood-opacity=".35"/>
    </filter>
    <filter id="goldGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#F2B84B" flood-opacity=".5"/>
    </filter>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#4DA3FF" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
    <style>
      .orbit { fill:none; stroke:#4DA3FF; stroke-opacity:.12; stroke-width:1.2; }
      .route { fill:none; stroke:url(#blueStroke); stroke-width:2; stroke-linecap:round; stroke-dasharray:7 10; animation: flow 7s linear infinite; }
      .pulse { filter:url(#nodeGlow); }
      .float-a { animation: driftA 6s ease-in-out infinite; transform-box:fill-box; transform-origin:center; }
      .float-b { animation: driftB 7.5s ease-in-out infinite; transform-box:fill-box; transform-origin:center; }
      .float-c { animation: driftC 8.5s ease-in-out infinite; transform-box:fill-box; transform-origin:center; }
      .core { animation: breathe 4.5s ease-in-out infinite; transform-box:fill-box; transform-origin:center; }
      .spark { animation: blink 2.8s ease-in-out infinite; }
      .spark.d2 { animation-delay:.9s; }
      .spark.d3 { animation-delay:1.7s; }
      @keyframes flow { to { stroke-dashoffset:-136; } }
      @keyframes driftA { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-7px)} }
      @keyframes driftB { 0%,100%{transform:translate(0,0)} 50%{transform:translate(5px,-5px)} }
      @keyframes driftC { 0%,100%{transform:translateY(0)} 50%{transform:translateY(6px)} }
      @keyframes breathe { 0%,100%{opacity:.9; transform:scale(1)} 50%{opacity:1; transform:scale(1.035)} }
      @keyframes blink { 0%,100%{opacity:.25} 50%{opacity:1} }
      @media (prefers-reduced-motion: reduce) { * { animation:none!important; } }
    </style>
  </defs>

  <rect width="920" height="650" fill="url(#bgGlow)"/>
  <ellipse cx="470" cy="322" rx="390" ry="270" fill="url(#grid)" opacity=".8"/>
  <ellipse class="orbit" cx="470" cy="322" rx="305" ry="220"/>
  <ellipse class="orbit" cx="470" cy="322" rx="238" ry="168"/>
  <ellipse class="orbit" cx="470" cy="322" rx="170" ry="118"/>

  <path class="route" d="M196 170 C270 179 315 226 350 269"/>
  <path class="route" d="M728 154 C656 181 624 228 590 270"/>
  <path class="route" d="M760 452 C684 438 630 402 590 379"/>
  <path class="route" d="M192 463 C267 436 316 405 350 383"/>
  <path class="route" d="M472 530 C471 501 470 474 470 450"/>
  <path class="route" d="M474 147 C472 162 470 178 470 194"/>

  <g class="float-a">
    <rect x="72" y="92" width="230" height="145" rx="24" fill="url(#panel)" stroke="#4DA3FF" stroke-opacity=".28"/>
    <rect x="94" y="115" width="186" height="98" rx="14" fill="#071A38" stroke="#4DA3FF" stroke-opacity=".18"/>
    <circle cx="111" cy="130" r="4" fill="#F2B84B"/>
    <circle cx="126" cy="130" r="4" fill="#4DA3FF" opacity=".65"/>
    <path d="M112 153H174M112 167H203M112 181H158" stroke="#9DD2FF" stroke-width="5" stroke-linecap="round" opacity=".55"/>
    <rect x="210" y="148" width="49" height="45" rx="9" fill="#1E63E9" fill-opacity=".16" stroke="#4DA3FF" stroke-opacity=".35"/>
    <path d="M222 181l9-14 8 7 9-15" fill="none" stroke="#F2B84B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="94" y="82" fill="#8CC9FF" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2">APPLICATIONS</text>
  </g>

  <g class="float-b">
    <text x="685" y="72" fill="#8CC9FF" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2">COMMERCE</text>
    <rect x="665" y="82" width="188" height="150" rx="24" fill="url(#panel)" stroke="#4DA3FF" stroke-opacity=".28"/>
    <rect x="716" y="98" width="82" height="118" rx="17" fill="#071A38" stroke="#74BEFF" stroke-opacity=".62" stroke-width="2"/>
    <rect x="726" y="113" width="62" height="82" rx="9" fill="#102E61" stroke="#4DA3FF" stroke-opacity=".20"/>
    <path d="M738 137h7l5 25h26l6-17h-34" fill="none" stroke="#F2B84B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="755" cy="170" r="4" fill="#FFD27A"/>
    <circle cx="774" cy="170" r="4" fill="#FFD27A"/>
    <rect x="742" y="121" width="30" height="6" rx="3" fill="#4DA3FF" opacity=".38"/>
    <circle cx="757" cy="205" r="4" fill="#4DA3FF" opacity=".65"/>
    <path d="M803 127h22M803 141h16M803 185h20" stroke="#8CC9FF" stroke-width="4" stroke-linecap="round" opacity=".48"/>
    <circle cx="815" cy="162" r="11" fill="#F2B84B" fill-opacity=".12" stroke="#F2B84B" stroke-opacity=".42"/>
    <path d="M810 162l4 4 7-9" fill="none" stroke="#FFD27A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g class="float-c">
    <rect x="706" y="394" width="154" height="156" rx="24" fill="url(#panel)" stroke="#4DA3FF" stroke-opacity=".24"/>
    <circle cx="783" cy="435" r="22" fill="#1E63E9" fill-opacity=".16" stroke="#4DA3FF" stroke-opacity=".45"/>
    <circle cx="783" cy="429" r="8" fill="#9DD2FF" opacity=".8"/>
    <path d="M766 449c7-11 27-11 34 0" fill="none" stroke="#9DD2FF" stroke-width="4" stroke-linecap="round" opacity=".8"/>
    <rect x="756" y="475" width="54" height="48" rx="10" fill="#071A38" stroke="#4DA3FF" stroke-opacity=".36"/>
    <path d="M768 487H798M768 498H790M768 509H800" stroke="#4DA3FF" stroke-width="3" stroke-linecap="round" opacity=".55"/>
    <text x="728" y="382" fill="#8CC9FF" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2">USERS</text>
  </g>

  <g class="float-b">
    <rect x="70" y="393" width="218" height="164" rx="24" fill="url(#panel)" stroke="#4DA3FF" stroke-opacity=".26"/>
    <g transform="translate(112 430)">
      <ellipse cx="54" cy="12" rx="48" ry="12" fill="#1E63E9" fill-opacity=".22" stroke="#4DA3FF" stroke-opacity=".6"/>
      <path d="M6 12v61c0 7 21 12 48 12s48-5 48-12V12" fill="#0A2146" stroke="#4DA3FF" stroke-opacity=".55"/>
      <path d="M6 32c0 7 21 12 48 12s48-5 48-12M6 52c0 7 21 12 48 12s48-5 48-12" fill="none" stroke="#4DA3FF" stroke-opacity=".42"/>
      <circle cx="88" cy="73" r="4" fill="#F2B84B" class="spark"/>
    </g>
    <text x="101" y="381" fill="#8CC9FF" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2">DATA</text>
  </g>

  <g class="float-a">
    <text x="402" y="32" fill="#8CC9FF" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2">CLOUD + APIs</text>
    <rect x="368" y="42" width="208" height="105" rx="24" fill="url(#panel)" stroke="#4DA3FF" stroke-opacity=".24"/>
    <g transform="translate(0 39)">
      <path d="M427 92h84c18 0 30-10 30-25 0-14-11-24-27-25-5-14-17-22-33-22-18 0-31 10-36 26-17 1-29 10-29 24 0 13 10 22 25 22z" fill="#1E63E9" fill-opacity=".14" stroke="#77BEFF" stroke-opacity=".62"/>
      <circle cx="452" cy="68" r="5" fill="#4DA3FF" class="spark"/>
      <circle cx="478" cy="68" r="5" fill="#F2B84B" class="spark d2"/>
      <circle cx="504" cy="68" r="5" fill="#4DA3FF" class="spark d3"/>
    </g>
  </g>

  <g class="core">
    <circle cx="470" cy="322" r="118" fill="#0A1D3D" fill-opacity=".92" stroke="#4DA3FF" stroke-opacity=".18"/>
    <circle cx="470" cy="322" r="96" fill="#102E61" fill-opacity=".88" stroke="url(#blueStroke)" stroke-width="2" filter="url(#softGlow)"/>
    <circle cx="470" cy="322" r="78" fill="none" stroke="url(#goldStroke)" stroke-width="3" stroke-opacity=".88" filter="url(#goldGlow)"/>
    <circle cx="470" cy="322" r="68" fill="#081B3A" stroke="#F2B84B" stroke-width="1.5" stroke-opacity=".55"/>
    <path d="M406 286a78 78 0 0 1 128-13" fill="none" stroke="#FFD27A" stroke-width="4" stroke-linecap="round" opacity=".82" filter="url(#goldGlow)"/>
    <circle cx="470" cy="322" r="110" fill="none" stroke="#4DA3FF" stroke-opacity=".22" stroke-dasharray="3 11"/>
  </g>

  <g filter="url(#nodeGlow)">
    <circle cx="350" cy="269" r="7" fill="#4DA3FF" class="pulse"/>
    <circle cx="590" cy="270" r="7" fill="#4DA3FF" class="pulse"/>
    <circle cx="590" cy="379" r="7" fill="#4DA3FF" class="pulse"/>
    <circle cx="350" cy="383" r="7" fill="#4DA3FF" class="pulse"/>
    <circle cx="470" cy="450" r="7" fill="#4DA3FF" class="pulse"/>
    <circle cx="470" cy="194" r="7" fill="#4DA3FF" class="pulse"/>
  </g>

  <g class="float-c">
    <rect x="371" y="530" width="205" height="88" rx="22" fill="url(#panel)" stroke="#4DA3FF" stroke-opacity=".24"/>
    <rect x="397" y="554" width="151" height="15" rx="7.5" fill="#071A38" stroke="#4DA3FF" stroke-opacity=".38"/>
    <rect x="397" y="578" width="151" height="15" rx="7.5" fill="#071A38" stroke="#4DA3FF" stroke-opacity=".38"/>
    <circle cx="413" cy="561.5" r="3" fill="#4DA3FF"/>
    <circle cx="426" cy="561.5" r="3" fill="#F2B84B"/>
    <circle cx="413" cy="585.5" r="3" fill="#4DA3FF"/>
    <text x="408" y="522" fill="#8CC9FF" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2">INFRASTRUCTURE</text>
  </g>
</svg>