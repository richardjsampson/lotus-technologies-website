<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 680" role="img" aria-labelledby="title desc">
  <title id="title">Connected Lotus technology ecosystem</title>
  <desc id="desc">Applications, commerce, users, cloud services, infrastructure and data connected through a central Lotus orchestration core.</desc>
  <defs>
    <radialGradient id="scene" cx="51%" cy="47%" r="62%"><stop offset="0" stop-color="#174A94" stop-opacity=".34"/><stop offset=".48" stop-color="#0D2C5A" stop-opacity=".12"/><stop offset="1" stop-color="#081A38" stop-opacity="0"/></radialGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#173E78" stop-opacity=".96"/><stop offset=".6" stop-color="#0D2C59" stop-opacity=".94"/><stop offset="1" stop-color="#081B3A" stop-opacity=".97"/></linearGradient>
    <linearGradient id="panelHot" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1D4E94" stop-opacity=".98"/><stop offset="1" stop-color="#0A2248" stop-opacity=".97"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#80CCFF"/><stop offset=".5" stop-color="#38A8FF"/><stop offset="1" stop-color="#1768F2"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFE09B"/><stop offset="1" stop-color="#F2B84B"/></linearGradient>
    <radialGradient id="halo"><stop offset="0" stop-color="#F2B84B" stop-opacity=".28"/><stop offset=".42" stop-color="#F2B84B" stop-opacity=".11"/><stop offset="1" stop-color="#F2B84B" stop-opacity="0"/></radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#020B18" flood-opacity=".42"/></filter>
    <filter id="nodeGlow" x="-100%" y="-100%" width="300%" height="300%"><feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#4DA3FF" flood-opacity=".65"/></filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#67B8FF" stroke-opacity=".045"/></pattern>
    <style>
      .route{fill:none;stroke:url(#blue);stroke-width:2.6;stroke-linecap:round;stroke-dasharray:8 11;animation:flow 6.5s linear infinite}.route2{fill:none;stroke:#5CB6FF;stroke-width:1.2;stroke-opacity:.22}.node{fill:#4DA3FF;filter:url(#nodeGlow)}
      .label{fill:#A8DAFF;font-family:Arial,sans-serif;font-weight:700;font-size:15px;letter-spacing:2.3px}.micro{fill:#8FCFFF;font-family:Arial,sans-serif;font-size:9px;letter-spacing:1.2px;opacity:.7}
      .float1{animation:f1 6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.float2{animation:f2 7.5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.float3{animation:f3 8.5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.core{animation:breathe 4.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.spark{animation:blink 2.4s ease-in-out infinite}
      @keyframes flow{to{stroke-dashoffset:-152}}@keyframes f1{50%{transform:translateY(-8px)}}@keyframes f2{50%{transform:translate(6px,-5px)}}@keyframes f3{50%{transform:translate(-4px,7px)}}@keyframes breathe{50%{transform:scale(1.035)}}@keyframes blink{50%{opacity:.25}}
      @media(prefers-reduced-motion:reduce){*{animation:none!important}}
    </style>
  </defs>

  <rect width="920" height="680" fill="#081B3A" fill-opacity=".02"/><ellipse cx="466" cy="325" rx="430" ry="300" fill="url(#scene)"/><ellipse cx="466" cy="325" rx="404" ry="278" fill="url(#grid)" opacity=".75"/>
  <path class="route2" d="M62 340C190 130 712 96 864 322C736 588 202 622 62 340Z"/><path class="route2" d="M138 329C240 176 677 155 790 329C674 515 244 526 138 329Z"/>

  <!-- luminous system routes -->
  <path class="route" d="M261 176C326 192 365 235 391 273"/><path class="route" d="M668 169C610 195 576 237 548 274"/><path class="route" d="M722 438C650 416 601 385 552 361"/><path class="route" d="M247 445C321 416 358 386 393 361"/><path class="route" d="M468 548C468 495 468 454 468 421"/><path class="route" d="M468 139C468 181 468 214 468 235"/>

  <!-- APPLICATIONS -->
  <g class="float1" filter="url(#softShadow)">
    <text class="label" x="60" y="78">APPLICATIONS</text>
    <path d="M47 95h220c16 0 29 13 29 29v112c0 16-13 29-29 29H47c-16 0-29-13-29-29V124c0-16 13-29 29-29z" fill="url(#panelHot)" stroke="#56B4FF" stroke-opacity=".46"/>
    <rect x="42" y="119" width="230" height="120" rx="18" fill="#071A38" stroke="#4DA3FF" stroke-opacity=".30"/>
    <circle cx="61" cy="139" r="4.5" fill="#F2B84B"/><circle cx="77" cy="139" r="4.5" fill="#4DA3FF"/>
    <path d="M59 165h75M59 181h112M59 197h57" stroke="#9AD5FF" stroke-width="6" stroke-linecap="round" opacity=".58"/>
    <rect x="179" y="153" width="63" height="58" rx="12" fill="#123A75" stroke="#4DA3FF" stroke-opacity=".5"/>
    <path d="M193 195l13-19 10 10 14-23" fill="none" stroke="url(#gold)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="micro" x="59" y="225">WEB  •  MOBILE  •  WORKFLOWS</text>
  </g>

  <!-- CLOUD + APIS -->
  <g class="float2" filter="url(#softShadow)">
    <text class="label" x="394" y="31">CLOUD + APIs</text>
    <rect x="356" y="47" width="224" height="118" rx="27" fill="url(#panel)" stroke="#56B4FF" stroke-opacity=".42"/>
    <path d="M409 125h113c20 0 34-12 34-29 0-16-13-28-31-29-6-16-20-26-38-26-20 0-36 12-41 30-19 1-33 12-33 28 0 15 12 26 29 26z" fill="#123A75" stroke="#78C8FF" stroke-opacity=".7"/>
    <circle cx="443" cy="99" r="6" fill="#4DA3FF"/><circle cx="469" cy="99" r="6" fill="#F2B84B"/><circle cx="495" cy="99" r="6" fill="#4DA3FF"/>
    <path d="M427 138h84" stroke="#5CB6FF" stroke-width="2" opacity=".45"/><text class="micro" x="428" y="151">SERVICES  •  APIs</text>
  </g>

  <!-- COMMERCE -->
  <g class="float3" filter="url(#softShadow)">
    <text class="label" x="700" y="67">COMMERCE</text>
    <rect x="669" y="83" width="213" height="169" rx="29" fill="url(#panelHot)" stroke="#56B4FF" stroke-opacity=".46"/>
    <rect x="718" y="101" width="91" height="133" rx="20" fill="#071A38" stroke="#70C5FF" stroke-width="2.2" stroke-opacity=".72"/>
    <rect x="730" y="116" width="67" height="91" rx="10" fill="#123A75"/>
    <path d="M743 142h9l5 27h26l7-19h-36" fill="none" stroke="url(#gold)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="763" cy="181" r="5" fill="#FFD27A"/><circle cx="783" cy="181" r="5" fill="#FFD27A"/><circle cx="764" cy="220" r="4.5" fill="#4DA3FF"/>
    <path d="M821 125h31M821 143h22M821 201h29" stroke="#93D2FF" stroke-width="5" stroke-linecap="round" opacity=".5"/>
    <circle cx="837" cy="175" r="13" fill="#F2B84B" fill-opacity=".14" stroke="#F2B84B" stroke-opacity=".58"/><path d="M831 175l5 5 9-12" fill="none" stroke="#FFD27A" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- DATA -->
  <g class="float2" filter="url(#softShadow)">
    <text class="label" x="53" y="397">DATA</text>
    <rect x="31" y="413" width="238" height="176" rx="29" fill="url(#panel)" stroke="#56B4FF" stroke-opacity=".42"/>
    <g transform="translate(80 448)">
      <ellipse cx="72" cy="13" rx="61" ry="14" fill="#153D7C" stroke="#65BCFF" stroke-opacity=".85"/>
      <path d="M11 13v76c0 9 27 15 61 15s61-6 61-15V13" fill="#0A2247" stroke="#56B4FF" stroke-opacity=".62"/>
      <path d="M11 37c0 9 27 15 61 15s61-6 61-15M11 62c0 9 27 15 61 15s61-6 61-15" fill="none" stroke="#56B4FF" stroke-opacity=".48"/>
      <circle cx="115" cy="89" r="5" fill="#F2B84B" class="spark"/>
    </g>
    <text class="micro" x="82" y="570">DATA  •  ANALYTICS</text>
  </g>

  <!-- USERS -->
  <g class="float1" filter="url(#softShadow)">
    <text class="label" x="741" y="406">USERS</text>
    <rect x="716" y="422" width="172" height="171" rx="29" fill="url(#panel)" stroke="#56B4FF" stroke-opacity=".42"/>
    <circle cx="802" cy="468" r="27" fill="#123A75" stroke="#6BC0FF" stroke-opacity=".7"/><circle cx="802" cy="461" r="10" fill="#9BD5FF"/><path d="M781 486c9-15 33-15 42 0" fill="none" stroke="#9BD5FF" stroke-width="5" stroke-linecap="round"/>
    <rect x="770" y="511" width="65" height="58" rx="12" fill="#071A38" stroke="#56B4FF" stroke-opacity=".5"/><path d="M782 526h39M782 539h28M782 553h38" stroke="#56B4FF" stroke-width="4" stroke-linecap="round" opacity=".65"/>
  </g>

  <!-- INFRASTRUCTURE: stronger rack/server illustration -->
  <g class="float3" filter="url(#softShadow)">
    <text class="label" x="383" y="576">INFRASTRUCTURE</text>
    <rect x="347" y="591" width="242" height="82" rx="25" fill="url(#panelHot)" stroke="#56B4FF" stroke-opacity=".46"/>
    <g transform="translate(375 606)">
      <rect width="186" height="16" rx="6" fill="#071A38" stroke="#61BCFF" stroke-opacity=".62"/><rect y="22" width="186" height="16" rx="6" fill="#071A38" stroke="#61BCFF" stroke-opacity=".62"/><rect y="44" width="186" height="16" rx="6" fill="#071A38" stroke="#61BCFF" stroke-opacity=".62"/>
      <circle cx="17" cy="8" r="3.5" fill="#4DA3FF"/><circle cx="29" cy="8" r="3.5" fill="#F2B84B"/><circle cx="17" cy="30" r="3.5" fill="#4DA3FF"/><circle cx="29" cy="30" r="3.5" fill="#4DA3FF"/><circle cx="17" cy="52" r="3.5" fill="#4DA3FF"/>
      <path d="M57 8h102M57 30h102M57 52h70" stroke="#2C7ED0" stroke-width="3" stroke-linecap="round" opacity=".5"/>
      <path d="M145 52h17l8-10" fill="none" stroke="#F2B84B" stroke-width="2.5" stroke-linecap="round"/>
    </g>
  </g>

  <!-- central orchestration core -->
  <g class="core">
    <circle cx="468" cy="326" r="137" fill="#071A38" fill-opacity=".85" stroke="#4DA3FF" stroke-opacity=".14"/>
    <circle cx="468" cy="326" r="118" fill="none" stroke="#4DA3FF" stroke-width="1" stroke-opacity=".16" stroke-dasharray="2 9"/>
    <circle cx="468" cy="326" r="101" fill="#102E61" stroke="url(#blue)" stroke-width="2.4" filter="url(#glow)"/>
    <circle cx="468" cy="326" r="77" fill="url(#halo)"/>
    <circle cx="468" cy="326" r="62" fill="#071A38" stroke="#4DA3FF" stroke-opacity=".26"/>
  </g>

  <g><circle class="node" cx="391" cy="273" r="8"/><circle class="node" cx="548" cy="274" r="8"/><circle class="node" cx="552" cy="361" r="8"/><circle class="node" cx="393" cy="361" r="8"/><circle class="node" cx="468" cy="421" r="8"/><circle class="node" cx="468" cy="235" r="8"/></g>
</svg>