<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 680" role="img" aria-labelledby="title desc">
<title id="title">Lotus connected technology scene</title>
<desc id="desc">A single layered technology environment showing cloud, applications, commerce, users, data and infrastructure connected through Lotus.</desc>
<defs>
  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#95DCFF"/><stop offset=".48" stop-color="#3AA8FF"/><stop offset="1" stop-color="#1768F2"/></linearGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1B4B91" stop-opacity=".92"/><stop offset="1" stop-color="#081D40" stop-opacity=".9"/></linearGradient>
  <linearGradient id="glass2" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#123E7F" stop-opacity=".88"/><stop offset="1" stop-color="#061731" stop-opacity=".92"/></linearGradient>
  <linearGradient id="gold"><stop stop-color="#FFE4A3"/><stop offset="1" stop-color="#F2B84B"/></linearGradient>
  <radialGradient id="scene" cx="52%" cy="48%" r="58%"><stop stop-color="#1D67CC" stop-opacity=".34"/><stop offset=".52" stop-color="#123A75" stop-opacity=".11"/><stop offset="1" stop-color="#081B3A" stop-opacity="0"/></radialGradient>
  <radialGradient id="halo"><stop stop-color="#F2B84B" stop-opacity=".28"/><stop offset=".42" stop-color="#F2B84B" stop-opacity=".10"/><stop offset="1" stop-color="#F2B84B" stop-opacity="0"/></radialGradient>
  <filter id="shadow" x="-60%" y="-60%" width="220%" height="240%"><feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#020814" flood-opacity=".48"/></filter>
  <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#4DA3FF" flood-opacity=".72"/></filter>
  <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#6CC1FF" stroke-opacity=".03"/></pattern>
  <style>
    .label{fill:#BDE6FF;font-family:Arial,sans-serif;font-size:14px;font-weight:700;letter-spacing:2.4px}.micro{fill:#8DCFFC;font-family:Arial,sans-serif;font-size:9px;letter-spacing:1.1px}.wire{fill:none;stroke:url(#blue);stroke-width:2.5;stroke-linecap:round;stroke-dasharray:6 11;animation:flow 6.5s linear infinite}.trace{fill:none;stroke:#5DB8FF;stroke-width:1.4;stroke-opacity:.24}.f1{animation:a 6.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.f2{animation:b 7.1s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.f3{animation:c 8.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.pulse{animation:p 4.5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes flow{to{stroke-dashoffset:-140}}@keyframes a{50%{transform:translate(-3px,-7px)}}@keyframes b{50%{transform:translate(5px,5px)}}@keyframes c{50%{transform:translate(-4px,6px)}}@keyframes p{50%{transform:scale(1.025)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
</defs>
<rect width="920" height="680" fill="url(#grid)"/><ellipse cx="488" cy="338" rx="420" ry="305" fill="url(#scene)"/>

<!-- one continuous visual flow -->
<path class="trace" d="M140 520C210 610 345 638 489 618C640 598 756 528 807 421"/>
<path class="trace" d="M110 252C190 130 332 70 494 78C663 86 786 178 846 307"/>
<path class="wire" d="M470 133C474 176 477 203 479 232"/>
<path class="wire" d="M333 268C385 280 419 292 449 313"/>
<path class="wire" d="M707 260C634 277 584 296 531 321"/>
<path class="wire" d="M326 445C383 425 425 401 455 377"/>
<path class="wire" d="M714 438C639 425 585 404 529 376"/>
<path class="wire" d="M494 420C494 474 495 514 496 553"/>

<!-- cloud canopy -->
<g class="f2" filter="url(#shadow)">
  <text class="label" x="418" y="42">CLOUD + APIs</text>
  <path d="M399 127h157c27 0 45-15 45-37 0-21-17-36-41-37-7-20-26-33-50-33-28 0-49 16-56 41-26 2-45 16-45 37 0 17 15 29 37 29z" fill="url(#glass)" stroke="#7CCEFF" stroke-opacity=".7"/>
  <circle cx="455" cy="92" r="6" fill="#4DA3FF"/><circle cx="480" cy="92" r="6" fill="#F2B84B"/><circle cx="505" cy="92" r="6" fill="#4DA3FF"/>
  <path d="M437 143h120" stroke="#5CB8FF" stroke-width="2" opacity=".4"/>
</g>

<!-- applications workspace, upper left, integrated into scene -->
<g class="f1" filter="url(#shadow)">
  <text class="label" x="48" y="126">APPLICATIONS</text>
  <g transform="translate(42 144) rotate(-2 128 74)">
    <rect width="258" height="148" rx="24" fill="url(#glass)" stroke="#69C3FF" stroke-opacity=".52"/>
    <rect x="18" y="18" width="222" height="112" rx="15" fill="#061731" stroke="#4DA3FF" stroke-opacity=".28"/>
    <circle cx="38" cy="38" r="4.5" fill="#F2B84B"/><circle cx="55" cy="38" r="4.5" fill="#4DA3FF"/>
    <path d="M39 64h74M39 82h108M39 100h59" stroke="#9DD7FF" stroke-width="6" stroke-linecap="round" opacity=".62"/>
    <rect x="159" y="53" width="60" height="58" rx="12" fill="#143D7D"/>
    <path d="M172 100l13-20 10 10 13-23" fill="none" stroke="url(#gold)" stroke-width="4" stroke-linecap="round"/>
  </g>
  <text class="micro" x="78" y="310">WEB · MOBILE · WORKFLOWS</text>
</g>

<!-- commerce device, upper right, no enclosing card -->
<g class="f3" filter="url(#shadow)">
  <text class="label" x="732" y="125">COMMERCE</text>
  <g transform="translate(724 143) rotate(3 58 78)">
    <rect width="118" height="164" rx="28" fill="#071A38" stroke="#7ACDFF" stroke-width="2.5"/>
    <rect x="14" y="18" width="90" height="107" rx="14" fill="#17468A"/>
    <path d="M31 51h10l6 32h35l9-23H45" fill="none" stroke="url(#gold)" stroke-width="6" stroke-linecap="round"/>
    <circle cx="59" cy="96" r="6" fill="#FFD27A"/><circle cx="83" cy="96" r="6" fill="#FFD27A"/><circle cx="59" cy="144" r="5" fill="#4DA3FF"/>
  </g>
  <g transform="translate(856 205)"><circle r="18" fill="#F2B84B" fill-opacity=".13" stroke="#F2B84B" stroke-opacity=".6"/><path d="M-8 0l6 6L9-10" fill="none" stroke="#FFD27A" stroke-width="3.5" stroke-linecap="round"/></g>
</g>

<!-- central Lotus orchestration layer: compact, not a target -->
<g class="pulse">
  <ellipse cx="493" cy="345" rx="126" ry="92" fill="#071A38" fill-opacity=".76" stroke="#4DA3FF" stroke-opacity=".14"/>
  <ellipse cx="493" cy="345" rx="105" ry="75" fill="#102F63" stroke="url(#blue)" stroke-width="2.5" filter="url(#glow)"/>
  <ellipse cx="493" cy="345" rx="76" ry="55" fill="url(#halo)"/>
  <ellipse cx="493" cy="345" rx="61" ry="45" fill="#071A38" stroke="#4DA3FF" stroke-opacity=".28"/>
</g>
<g filter="url(#glow)"><circle cx="449" cy="313" r="7" fill="#4DA3FF"/><circle cx="531" cy="321" r="7" fill="#4DA3FF"/><circle cx="455" cy="377" r="7" fill="#4DA3FF"/><circle cx="529" cy="376" r="7" fill="#4DA3FF"/><circle cx="479" cy="232" r="7" fill="#4DA3FF"/><circle cx="494" cy="420" r="7" fill="#4DA3FF"/></g>

<!-- data foundation, left lower -->
<g class="f2" filter="url(#shadow)">
  <text class="label" x="71" y="430">DATA</text>
  <g transform="translate(72 449)">
    <ellipse cx="75" cy="17" rx="65" ry="16" fill="#15417F" stroke="#77C9FF"/>
    <path d="M10 17v90c0 10 29 17 65 17s65-7 65-17V17" fill="#092149" stroke="#58B6FF" stroke-opacity=".7"/>
    <path d="M10 47c0 10 29 17 65 17s65-7 65-17M10 77c0 10 29 17 65 17s65-7 65-17" fill="none" stroke="#58B6FF" stroke-opacity=".5"/>
    <circle cx="123" cy="105" r="5" fill="#F2B84B"/>
  </g>
  <text class="micro" x="83" y="592">DATA · ANALYTICS</text>
</g>

<!-- users / endpoints, right lower -->
<g class="f1" filter="url(#shadow)">
  <text class="label" x="744" y="421">USERS</text>
  <g transform="translate(744 439)">
    <circle cx="55" cy="42" r="34" fill="url(#glass)" stroke="#72C6FF"/>
    <circle cx="55" cy="32" r="12" fill="#A4DCFF"/><path d="M32 62c9-18 37-18 46 0" fill="none" stroke="#A4DCFF" stroke-width="6" stroke-linecap="round"/>
    <rect x="8" y="88" width="94" height="63" rx="14" fill="#071A38" stroke="#5DBAFF" stroke-opacity=".58"/>
    <path d="M26 106h59M26 123h42M26 140h58" stroke="#5DBAFF" stroke-width="5" stroke-linecap="round" opacity=".72"/>
  </g>
</g>

<!-- infrastructure base: wider and structural -->
<g class="f3" filter="url(#shadow)">
  <text class="label" x="417" y="565">INFRASTRUCTURE</text>
  <g transform="translate(350 583)">
    <rect width="290" height="86" rx="20" fill="url(#glass2)" stroke="#64BFFF" stroke-opacity=".56"/>
    <g transform="translate(20 14)">
      <rect width="250" height="17" rx="6" fill="#061731" stroke="#65C0FF" stroke-opacity=".7"/><rect y="22" width="250" height="17" rx="6" fill="#061731" stroke="#65C0FF" stroke-opacity=".7"/><rect y="44" width="250" height="17" rx="6" fill="#061731" stroke="#65C0FF" stroke-opacity=".7"/>
      <circle cx="18" cy="8.5" r="4" fill="#4DA3FF"/><circle cx="33" cy="8.5" r="4" fill="#F2B84B"/><circle cx="18" cy="30.5" r="4" fill="#4DA3FF"/><circle cx="33" cy="30.5" r="4" fill="#4DA3FF"/><circle cx="18" cy="52.5" r="4" fill="#4DA3FF"/>
      <path d="M67 8.5h143M67 30.5h143M67 52.5h102" stroke="#2E7FCF" stroke-width="3" stroke-linecap="round"/><path d="M188 52.5h24l12-13" fill="none" stroke="#F2B84B" stroke-width="3" stroke-linecap="round"/>
    </g>
  </g>
</g>
</svg>