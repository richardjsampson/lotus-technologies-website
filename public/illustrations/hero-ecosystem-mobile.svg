<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 900" role="img" aria-labelledby="title desc">
<title id="title">Lotus mobile technology ecosystem</title><desc id="desc">Applications, cloud APIs, commerce, data, users and infrastructure arranged around a central Lotus orchestration core.</desc>
<defs>
<linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#91DAFF"/><stop offset=".5" stop-color="#3AA8FF"/><stop offset="1" stop-color="#1768F2"/></linearGradient>
<linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1A4A8D" stop-opacity=".9"/><stop offset="1" stop-color="#081D40" stop-opacity=".85"/></linearGradient>
<linearGradient id="gold"><stop stop-color="#FFE4A3"/><stop offset="1" stop-color="#F2B84B"/></linearGradient>
<radialGradient id="scene"><stop stop-color="#1D67CC" stop-opacity=".34"/><stop offset=".52" stop-color="#123A75" stop-opacity=".1"/><stop offset="1" stop-color="#081B3A" stop-opacity="0"/></radialGradient>
<radialGradient id="halo"><stop stop-color="#F2B84B" stop-opacity=".3"/><stop offset=".4" stop-color="#F2B84B" stop-opacity=".11"/><stop offset="1" stop-color="#F2B84B" stop-opacity="0"/></radialGradient>
<filter id="shadow" x="-60%" y="-60%" width="220%" height="240%"><feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#020814" flood-opacity=".5"/></filter>
<filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#4DA3FF" flood-opacity=".8"/></filter>
<pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse"><path d="M38 0H0V38" fill="none" stroke="#68BDFF" stroke-opacity=".035"/></pattern>
<style>.label{fill:#C0E7FF;font-family:Arial,sans-serif;font-size:19px;font-weight:700;letter-spacing:2.7px}.micro{fill:#8BCBFA;font-family:Arial,sans-serif;font-size:11px;letter-spacing:1px}.wire{fill:none;stroke:url(#blue);stroke-width:3;stroke-linecap:round;stroke-dasharray:7 12;animation:flow 6s linear infinite}.ambient{fill:none;stroke:#4DA3FF;stroke-width:1.2;stroke-opacity:.17}.f1{animation:a 6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.f2{animation:b 7s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.f3{animation:c 8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.core{animation:p 4.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes flow{to{stroke-dashoffset:-150}}@keyframes a{50%{transform:translateY(-7px)}}@keyframes b{50%{transform:translate(5px,6px)}}@keyframes c{50%{transform:translate(-5px,7px)}}@keyframes p{50%{transform:scale(1.035)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style>
</defs>
<rect width="640" height="900" fill="url(#grid)"/><ellipse cx="320" cy="440" rx="306" ry="414" fill="url(#scene)"/>
<path class="ambient" d="M40 380C120 110 500 90 602 330"/><path class="ambient" d="M60 610C180 840 480 826 600 560"/>
<!-- flowing paths -->
<path class="wire" d="M175 205C230 252 258 303 277 350"/><path class="wire" d="M472 205C414 252 383 302 363 350"/><path class="wire" d="M103 563C189 535 243 501 278 469"/><path class="wire" d="M542 560C456 534 401 500 363 468"/><path class="wire" d="M322 214C322 262 322 306 322 329"/><path class="wire" d="M355 524C385 596 401 646 407 692"/>
<!-- Applications -->
<g class="f1" filter="url(#shadow)"><text class="label" x="34" y="66">APPLICATIONS</text><g transform="translate(28 84) rotate(-2 115 69)"><rect width="234" height="138" rx="22" fill="url(#glass)" stroke="#69C1FF" stroke-opacity=".55"/><rect x="17" y="18" width="200" height="101" rx="14" fill="#061731" stroke="#4DA3FF" stroke-opacity=".3"/><circle cx="35" cy="36" r="4" fill="#F2B84B"/><circle cx="51" cy="36" r="4" fill="#4DA3FF"/><path d="M35 59h65M35 76h99M35 93h52" stroke="#9DD7FF" stroke-width="6" stroke-linecap="round" opacity=".65"/><rect x="146" y="51" width="52" height="50" rx="10" fill="#143D7D"/><path d="M158 91l10-16 9 8 10-18" fill="none" stroke="url(#gold)" stroke-width="4" stroke-linecap="round"/></g></g>
<!-- Commerce -->
<g class="f2" filter="url(#shadow)"><text class="label" x="420" y="76">COMMERCE</text><g transform="translate(426 91) rotate(3 58 76)"><rect x="0" width="112" height="151" rx="26" fill="#071A38" stroke="#7ACDFF" stroke-width="2.3"/><rect x="14" y="17" width="84" height="98" rx="13" fill="#17468A"/><path d="M30 48h9l6 30h32l8-22H43" fill="none" stroke="url(#gold)" stroke-width="6" stroke-linecap="round"/><circle cx="56" cy="91" r="5" fill="#FFD27A"/><circle cx="77" cy="91" r="5" fill="#FFD27A"/><circle cx="56" cy="132" r="5" fill="#4DA3FF"/></g><circle cx="556" cy="151" r="17" fill="#F2B84B" fill-opacity=".13" stroke="#F2B84B" stroke-opacity=".55"/><path d="M549 151l5 5 8-11" fill="none" stroke="#FFD27A" stroke-width="3" stroke-linecap="round"/></g>
<!-- Cloud, floating behind core -->
<g class="f3" filter="url(#shadow)"><text class="label" x="234" y="210">CLOUD + APIs</text><path d="M247 288h149c24 0 41-14 41-34 0-19-15-33-37-34-7-19-24-30-46-30-25 0-43 14-50 36-23 2-40 14-40 33 0 17 14 29 34 29z" fill="#123C78" fill-opacity=".9" stroke="#7ACBFF" stroke-opacity=".72"/><circle cx="300" cy="254" r="6" fill="#4DA3FF"/><circle cx="322" cy="254" r="6" fill="#F2B84B"/><circle cx="344" cy="254" r="6" fill="#4DA3FF"/></g>
<!-- Core -->
<g class="core"><circle cx="322" cy="407" r="139" fill="#061731" fill-opacity=".72" stroke="#4DA3FF" stroke-opacity=".14"/><circle cx="322" cy="407" r="115" fill="#102F63" stroke="url(#blue)" stroke-width="3" filter="url(#glow)"/><circle cx="322" cy="407" r="88" fill="url(#halo)"/><circle cx="322" cy="407" r="67" fill="#071A38" stroke="#4DA3FF" stroke-opacity=".28"/><circle cx="322" cy="407" r="129" fill="none" stroke="#4DA3FF" stroke-opacity=".18" stroke-dasharray="2 10"/></g>
<g filter="url(#glow)"><circle cx="277" cy="350" r="8" fill="#4DA3FF"/><circle cx="363" cy="350" r="8" fill="#4DA3FF"/><circle cx="278" cy="469" r="8" fill="#4DA3FF"/><circle cx="363" cy="468" r="8" fill="#4DA3FF"/><circle cx="322" cy="329" r="8" fill="#4DA3FF"/><circle cx="355" cy="524" r="8" fill="#4DA3FF"/></g>
<!-- Data -->
<g class="f2" filter="url(#shadow)"><text class="label" x="34" y="566">DATA</text><g transform="translate(40 584)"><ellipse cx="76" cy="16" rx="66" ry="16" fill="#15417F" stroke="#77C9FF"/><path d="M10 16v86c0 10 30 17 66 17s66-7 66-17V16" fill="#092149" stroke="#58B6FF" stroke-opacity=".68"/><path d="M10 44c0 10 30 17 66 17s66-7 66-17M10 72c0 10 30 17 66 17s66-7 66-17" fill="none" stroke="#58B6FF" stroke-opacity=".5"/><circle cx="126" cy="101" r="5" fill="#F2B84B"/></g><text class="micro" x="52" y="730">DATA · ANALYTICS</text></g>
<!-- Users -->
<g class="f1" filter="url(#shadow)"><text class="label" x="455" y="566">USERS</text><g transform="translate(465 584)"><circle cx="55" cy="42" r="34" fill="url(#glass)" stroke="#72C6FF"/><circle cx="55" cy="32" r="12" fill="#A4DCFF"/><path d="M32 62c9-18 37-18 46 0" fill="none" stroke="#A4DCFF" stroke-width="6" stroke-linecap="round"/><rect x="8" y="88" width="94" height="63" rx="14" fill="#071A38" stroke="#5DBAFF" stroke-opacity=".58"/><path d="M26 106h59M26 123h42M26 140h58" stroke="#5DBAFF" stroke-width="5" stroke-linecap="round" opacity=".72"/></g></g>
<!-- Infrastructure, prominent lower layer -->
<g class="f3" filter="url(#shadow)"><text class="label" x="224" y="750">INFRASTRUCTURE</text><g transform="translate(187 768)"><rect width="270" height="105" rx="20" fill="url(#glass)" stroke="#64BFFF" stroke-opacity=".54"/><g transform="translate(20 16)"><rect width="230" height="20" rx="7" fill="#061731" stroke="#65C0FF" stroke-opacity=".7"/><rect y="28" width="230" height="20" rx="7" fill="#061731" stroke="#65C0FF" stroke-opacity=".7"/><rect y="56" width="230" height="20" rx="7" fill="#061731" stroke="#65C0FF" stroke-opacity=".7"/><circle cx="18" cy="10" r="4" fill="#4DA3FF"/><circle cx="33" cy="10" r="4" fill="#F2B84B"/><circle cx="18" cy="38" r="4" fill="#4DA3FF"/><circle cx="33" cy="38" r="4" fill="#4DA3FF"/><circle cx="18" cy="66" r="4" fill="#4DA3FF"/><path d="M66 10h129M66 38h129M66 66h95" stroke="#2E7FCF" stroke-width="3" stroke-linecap="round"/><path d="M173 66h22l12-13" fill="none" stroke="#F2B84B" stroke-width="3" stroke-linecap="round"/></g></g></g>
</svg>