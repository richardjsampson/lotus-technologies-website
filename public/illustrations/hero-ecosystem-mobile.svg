<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 900" role="img" aria-labelledby="title desc">
<title id="title">Lotus mobile connected technology scene</title>
<desc id="desc">A single vertical technology environment showing cloud, applications, commerce, users, data and infrastructure connected through Lotus.</desc>
<defs>
  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#95DDFF"/><stop offset=".5" stop-color="#3AA8FF"/><stop offset="1" stop-color="#1768F2"/></linearGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1B4B91" stop-opacity=".93"/><stop offset="1" stop-color="#081D40" stop-opacity=".91"/></linearGradient>
  <linearGradient id="glass2" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#123E7F" stop-opacity=".9"/><stop offset="1" stop-color="#061731" stop-opacity=".94"/></linearGradient>
  <linearGradient id="gold"><stop stop-color="#FFE4A3"/><stop offset="1" stop-color="#F2B84B"/></linearGradient>
  <radialGradient id="scene"><stop stop-color="#1D67CC" stop-opacity=".36"/><stop offset=".52" stop-color="#123A75" stop-opacity=".11"/><stop offset="1" stop-color="#081B3A" stop-opacity="0"/></radialGradient>
  <radialGradient id="halo"><stop stop-color="#F2B84B" stop-opacity=".28"/><stop offset=".42" stop-color="#F2B84B" stop-opacity=".1"/><stop offset="1" stop-color="#F2B84B" stop-opacity="0"/></radialGradient>
  <filter id="shadow" x="-60%" y="-60%" width="220%" height="240%"><feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#020814" flood-opacity=".5"/></filter>
  <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#4DA3FF" flood-opacity=".78"/></filter>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#6CC1FF" stroke-opacity=".03"/></pattern>
  <style>
    .label{fill:#C2E9FF;font-family:Arial,sans-serif;font-size:18px;font-weight:700;letter-spacing:2.6px}.micro{fill:#8CCDFC;font-family:Arial,sans-serif;font-size:10px;letter-spacing:1px}.wire{fill:none;stroke:url(#blue);stroke-width:3;stroke-linecap:round;stroke-dasharray:7 12;animation:flow 6s linear infinite}.trace{fill:none;stroke:#5DB8FF;stroke-width:1.4;stroke-opacity:.2}.f1{animation:a 6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.f2{animation:b 7s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.f3{animation:c 8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.pulse{animation:p 4.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes flow{to{stroke-dashoffset:-150}}@keyframes a{50%{transform:translateY(-6px)}}@keyframes b{50%{transform:translate(4px,5px)}}@keyframes c{50%{transform:translate(-4px,6px)}}@keyframes p{50%{transform:scale(1.025)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
</defs>
<rect width="640" height="900" fill="url(#grid)"/><ellipse cx="320" cy="438" rx="306" ry="416" fill="url(#scene)"/>

<!-- continuous vertical backbone and side flows -->
<path class="trace" d="M320 96C320 180 320 266 320 348C320 462 320 590 320 804"/>
<path class="wire" d="M320 141V249"/><path class="wire" d="M238 337C264 358 282 375 299 397"/><path class="wire" d="M461 330C414 351 377 374 342 400"/><path class="wire" d="M171 559C224 533 267 505 300 475"/><path class="wire" d="M478 549C426 527 383 503 341 475"/><path class="wire" d="M320 500V694"/>

<!-- cloud canopy -->
<g class="f2" filter="url(#shadow)">
  <text class="label" x="224" y="54">CLOUD + APIs</text>
  <path d="M224 153h192c30 0 51-17 51-41 0-23-19-40-46-41-8-23-29-37-57-37-31 0-55 18-63 46-29 2-50 18-50 42 0 19 17 31 42 31z" fill="url(#glass)" stroke="#7CCEFF" stroke-opacity=".72"/>
  <circle cx="288" cy="111" r="7" fill="#4DA3FF"/><circle cx="320" cy="111" r="7" fill="#F2B84B"/><circle cx="352" cy="111" r="7" fill="#4DA3FF"/>
</g>

<!-- application workspace, left mid -->
<g class="f1" filter="url(#shadow)">
  <text class="label" x="30" y="252">APPLICATIONS</text>
  <g transform="translate(28 272) rotate(-2 105 66)">
    <rect width="220" height="132" rx="22" fill="url(#glass)" stroke="#69C3FF" stroke-opacity=".56"/>
    <rect x="16" y="17" width="188" height="98" rx="14" fill="#061731" stroke="#4DA3FF" stroke-opacity=".28"/>
    <circle cx="34" cy="35" r="4" fill="#F2B84B"/><circle cx="49" cy="35" r="4" fill="#4DA3FF"/>
    <path d="M34 58h62M34 74h91M34 90h49" stroke="#9DD7FF" stroke-width="6" stroke-linecap="round" opacity=".64"/>
    <rect x="136" y="49" width="50" height="49" rx="10" fill="#143D7D"/><path d="M148 89l10-15 8 7 10-18" fill="none" stroke="url(#gold)" stroke-width="4" stroke-linecap="round"/>
  </g>
</g>

<!-- commerce phone, right mid -->
<g class="f3" filter="url(#shadow)">
  <text class="label" x="420" y="244">COMMERCE</text>
  <g transform="translate(443 265) rotate(3 55 72)">
    <rect width="110" height="148" rx="26" fill="#071A38" stroke="#7ACDFF" stroke-width="2.4"/>
    <rect x="13" y="17" width="84" height="95" rx="13" fill="#17468A"/>
    <path d="M29 47h9l6 29h31l8-21H42" fill="none" stroke="url(#gold)" stroke-width="6" stroke-linecap="round"/>
    <circle cx="55" cy="89" r="5" fill="#FFD27A"/><circle cx="76" cy="89" r="5" fill="#FFD27A"/><circle cx="55" cy="130" r="5" fill="#4DA3FF"/>
  </g>
  <circle cx="569" cy="331" r="17" fill="#F2B84B" fill-opacity=".13" stroke="#F2B84B" stroke-opacity=".56"/><path d="M562 331l5 5 8-11" fill="none" stroke="#FFD27A" stroke-width="3" stroke-linecap="round"/>
</g>

<!-- Lotus orchestration platform integrated between upper and lower layers -->
<g class="pulse">
  <ellipse cx="320" cy="435" rx="122" ry="86" fill="#061731" fill-opacity=".72" stroke="#4DA3FF" stroke-opacity=".14"/>
  <ellipse cx="320" cy="435" rx="100" ry="69" fill="#102F63" stroke="url(#blue)" stroke-width="3" filter="url(#glow)"/>
  <ellipse cx="320" cy="435" rx="73" ry="50" fill="url(#halo)"/>
  <ellipse cx="320" cy="435" rx="58" ry="41" fill="#071A38" stroke="#4DA3FF" stroke-opacity=".28"/>
</g>
<g filter="url(#glow)"><circle cx="299" cy="397" r="8" fill="#4DA3FF"/><circle cx="342" cy="400" r="8" fill="#4DA3FF"/><circle cx="300" cy="475" r="8" fill="#4DA3FF"/><circle cx="341" cy="475" r="8" fill="#4DA3FF"/><circle cx="320" cy="249" r="8" fill="#4DA3FF"/><circle cx="320" cy="500" r="8" fill="#4DA3FF"/></g>

<!-- data left lower -->
<g class="f2" filter="url(#shadow)">
  <text class="label" x="38" y="548">DATA</text>
  <g transform="translate(44 569)">
    <ellipse cx="71" cy="15" rx="61" ry="15" fill="#15417F" stroke="#77C9FF"/>
    <path d="M10 15v82c0 9 27 16 61 16s61-7 61-16V15" fill="#092149" stroke="#58B6FF" stroke-opacity=".7"/>
    <path d="M10 43c0 9 27 16 61 16s61-7 61-16M10 70c0 9 27 16 61 16s61-7 61-16" fill="none" stroke="#58B6FF" stroke-opacity=".5"/>
    <circle cx="116" cy="96" r="5" fill="#F2B84B"/>
  </g>
  <text class="micro" x="52" y="704">DATA · ANALYTICS</text>
</g>

<!-- users right lower -->
<g class="f1" filter="url(#shadow)">
  <text class="label" x="460" y="544">USERS</text>
  <g transform="translate(466 566)">
    <circle cx="50" cy="38" r="31" fill="url(#glass)" stroke="#72C6FF"/>
    <circle cx="50" cy="29" r="11" fill="#A4DCFF"/><path d="M29 57c8-17 34-17 42 0" fill="none" stroke="#A4DCFF" stroke-width="6" stroke-linecap="round"/>
    <rect x="7" y="79" width="86" height="58" rx="13" fill="#071A38" stroke="#5DBAFF" stroke-opacity=".58"/><path d="M23 96h55M23 112h39M23 127h53" stroke="#5DBAFF" stroke-width="5" stroke-linecap="round" opacity=".72"/>
  </g>
</g>

<!-- infrastructure base, centered and broad -->
<g class="f3" filter="url(#shadow)">
  <text class="label" x="216" y="726">INFRASTRUCTURE</text>
  <g transform="translate(150 748)">
    <rect width="340" height="116" rx="22" fill="url(#glass2)" stroke="#64BFFF" stroke-opacity=".58"/>
    <g transform="translate(24 18)">
      <rect width="292" height="20" rx="7" fill="#061731" stroke="#65C0FF" stroke-opacity=".72"/><rect y="28" width="292" height="20" rx="7" fill="#061731" stroke="#65C0FF" stroke-opacity=".72"/><rect y="56" width="292" height="20" rx="7" fill="#061731" stroke="#65C0FF" stroke-opacity=".72"/>
      <circle cx="19" cy="10" r="4" fill="#4DA3FF"/><circle cx="35" cy="10" r="4" fill="#F2B84B"/><circle cx="19" cy="38" r="4" fill="#4DA3FF"/><circle cx="35" cy="38" r="4" fill="#4DA3FF"/><circle cx="19" cy="66" r="4" fill="#4DA3FF"/>
      <path d="M74 10h174M74 38h174M74 66h128" stroke="#2E7FCF" stroke-width="3" stroke-linecap="round"/><path d="M220 66h28l13-14" fill="none" stroke="#F2B84B" stroke-width="3" stroke-linecap="round"/>
    </g>
  </g>
</g>
</svg>