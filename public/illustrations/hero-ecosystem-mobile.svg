<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 700" role="img" aria-labelledby="title desc">
<title id="title">Lotus connected technology platform</title>
<desc id="desc">A compact layered platform showing cloud APIs, applications, commerce, data, users and infrastructure connected through Lotus orchestration.</desc>
<defs>
  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#A7E3FF"/><stop offset=".45" stop-color="#48B3FF"/><stop offset="1" stop-color="#1768F2"/></linearGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#184888" stop-opacity=".96"/><stop offset="1" stop-color="#071A38" stop-opacity=".94"/></linearGradient>
  <linearGradient id="surface" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#12366B" stop-opacity=".9"/><stop offset="1" stop-color="#06162F" stop-opacity=".98"/></linearGradient>
  <linearGradient id="gold"><stop stop-color="#FFE4A3"/><stop offset="1" stop-color="#F2B84B"/></linearGradient>
  <radialGradient id="scene"><stop stop-color="#1D67CC" stop-opacity=".33"/><stop offset=".52" stop-color="#123A75" stop-opacity=".1"/><stop offset="1" stop-color="#081B3A" stop-opacity="0"/></radialGradient>
  <radialGradient id="core"><stop stop-color="#2155A1"/><stop offset=".7" stop-color="#0C2854"/><stop offset="1" stop-color="#071A38"/></radialGradient>
  <filter id="shadow" x="-60%" y="-60%" width="220%" height="240%"><feDropShadow dx="0" dy="15" stdDeviation="15" flood-color="#020814" flood-opacity=".48"/></filter>
  <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#4DA3FF" flood-opacity=".7"/></filter>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#6CC1FF" stroke-opacity=".025"/></pattern>
  <style>
    .label{fill:#C7EBFF;font-family:Arial,sans-serif;font-size:17px;font-weight:700;letter-spacing:2.5px}.small{fill:#91D1FF;font-family:Arial,sans-serif;font-size:10px;font-weight:700;letter-spacing:1.5px}.trace{fill:none;stroke:#55B6FF;stroke-width:2;stroke-linecap:round;stroke-opacity:.32}.flow{fill:none;stroke:url(#blue);stroke-width:3;stroke-linecap:round;stroke-dasharray:7 11;animation:flow 5.5s linear infinite}.pulse{animation:pulse 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.float{animation:float 6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes flow{to{stroke-dashoffset:-144}}@keyframes pulse{50%{transform:scale(1.025)}}@keyframes float{50%{transform:translateY(-5px)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
</defs>
<rect width="640" height="700" fill="url(#grid)"/><ellipse cx="320" cy="352" rx="300" ry="320" fill="url(#scene)"/>

<!-- one continuous platform silhouette -->
<path d="M116 185C116 164 133 147 154 147H486C507 147 524 164 524 185V501C524 523 507 540 486 540H154C133 540 116 523 116 501Z" fill="#06162F" fill-opacity=".34" stroke="#4DA3FF" stroke-opacity=".12"/>

<!-- cloud canopy -->
<g class="float" filter="url(#shadow)">
  <text class="label" x="236" y="51">CLOUD + APIs</text>
  <path d="M221 132h198c28 0 48-16 48-38 0-22-18-37-43-38-8-21-28-34-54-34-30 0-52 17-60 42-27 2-47 17-47 39 0 18 16 29 39 29z" fill="url(#glass)" stroke="#7CCEFF" stroke-opacity=".68"/>
  <circle cx="288" cy="94" r="6" fill="#4DA3FF"/><circle cx="320" cy="94" r="6" fill="#F2B84B"/><circle cx="352" cy="94" r="6" fill="#4DA3FF"/>
</g>
<path class="flow" d="M320 132V176"/>

<!-- shared interface layer -->
<g filter="url(#shadow)">
  <rect x="82" y="176" width="476" height="146" rx="28" fill="url(#surface)" stroke="#5DBAFF" stroke-opacity=".34"/>
  <path d="M320 189V306" class="trace"/>

  <text class="label" x="105" y="205">APPLICATIONS</text>
  <rect x="104" y="222" width="190" height="78" rx="16" fill="#081C3B" stroke="#4DA3FF" stroke-opacity=".34"/>
  <circle cx="122" cy="240" r="4" fill="#F2B84B"/><circle cx="137" cy="240" r="4" fill="#4DA3FF"/>
  <path d="M122 260h54M122 275h82" stroke="#9DD7FF" stroke-width="5" stroke-linecap="round" opacity=".6"/>
  <rect x="228" y="239" width="48" height="43" rx="9" fill="#143D7D"/><path d="M238 273l10-14 7 7 10-18" fill="none" stroke="url(#gold)" stroke-width="3.5" stroke-linecap="round"/>

  <text class="label" x="364" y="205">COMMERCE</text>
  <rect x="390" y="218" width="76" height="88" rx="18" fill="#071A38" stroke="#74C9FF" stroke-width="2"/>
  <rect x="402" y="232" width="52" height="50" rx="9" fill="#17468A"/>
  <path d="M411 247h7l5 22h20l6-15h-28" fill="none" stroke="url(#gold)" stroke-width="4" stroke-linecap="round"/>
  <circle cx="425" cy="275" r="4" fill="#FFD27A"/><circle cx="442" cy="275" r="4" fill="#FFD27A"/>
</g>

<!-- orchestration bridge: the visual heart -->
<g class="pulse" filter="url(#glow)">
  <path d="M124 346C124 327 140 312 159 312H481C500 312 516 327 516 346V383C516 402 500 417 481 417H159C140 417 124 402 124 383Z" fill="url(#glass)" stroke="url(#blue)" stroke-width="2.5"/>
  <circle cx="320" cy="364" r="61" fill="url(#core)" stroke="#5CBBFF" stroke-width="2"/>
  <circle cx="320" cy="364" r="49" fill="#071A38" stroke="#4DA3FF" stroke-opacity=".34"/>
  <path d="M159 364H252M388 364H481" stroke="#50B4FF" stroke-width="2" stroke-opacity=".42"/>
  <circle cx="183" cy="364" r="5" fill="#4DA3FF"/><circle cx="214" cy="364" r="5" fill="#4DA3FF"/><circle cx="426" cy="364" r="5" fill="#4DA3FF"/><circle cx="457" cy="364" r="5" fill="#F2B84B"/>
</g>
<text class="small" x="253" y="431">LOTUS ORCHESTRATION</text>
<path class="flow" d="M320 417V454"/>

<!-- shared operations layer -->
<g filter="url(#shadow)">
  <rect x="97" y="452" width="446" height="110" rx="25" fill="url(#surface)" stroke="#5DBAFF" stroke-opacity=".3"/>
  <path d="M320 465V548" class="trace"/>

  <text class="label" x="126" y="482">DATA</text>
  <ellipse cx="178" cy="512" rx="44" ry="11" fill="#15417F" stroke="#77C9FF"/><path d="M134 512v29c0 7 20 12 44 12s44-5 44-12v-29" fill="#092149" stroke="#58B6FF" stroke-opacity=".66"/><path d="M134 527c0 7 20 12 44 12s44-5 44-12" fill="none" stroke="#58B6FF" stroke-opacity=".5"/><circle cx="207" cy="543" r="4" fill="#F2B84B"/>

  <text class="label" x="392" y="482">USERS</text>
  <circle cx="437" cy="518" r="28" fill="#123C78" stroke="#71C5FF"/><circle cx="437" cy="510" r="9" fill="#A4DCFF"/><path d="M419 532c7-14 29-14 36 0" fill="none" stroke="#A4DCFF" stroke-width="5" stroke-linecap="round"/>
</g>
<path class="flow" d="M320 562V586"/>

<!-- infrastructure foundation -->
<g filter="url(#shadow)">
  <text class="label" x="222" y="592">INFRASTRUCTURE</text>
  <path d="M128 616h384v34c0 17-14 31-31 31H159c-17 0-31-14-31-31z" fill="url(#glass)" stroke="#64BFFF" stroke-opacity=".55"/>
  <g transform="translate(156 626)">
    <rect width="328" height="13" rx="5" fill="#061731" stroke="#65C0FF" stroke-opacity=".68"/><rect y="18" width="328" height="13" rx="5" fill="#061731" stroke="#65C0FF" stroke-opacity=".68"/><rect y="36" width="328" height="13" rx="5" fill="#061731" stroke="#65C0FF" stroke-opacity=".68"/>
    <circle cx="15" cy="6.5" r="3" fill="#4DA3FF"/><circle cx="27" cy="6.5" r="3" fill="#F2B84B"/><circle cx="15" cy="24.5" r="3" fill="#4DA3FF"/><circle cx="15" cy="42.5" r="3" fill="#4DA3FF"/>
    <path d="M57 6.5h222M57 24.5h222M57 42.5h164" stroke="#2E7FCF" stroke-width="2.5" stroke-linecap="round"/><path d="M245 42.5h34l12-12" fill="none" stroke="#F2B84B" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</g>
</svg>